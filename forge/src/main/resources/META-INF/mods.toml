modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/Stalemated/custom-tooltip-api/issues"
license = "MIT"
clientSideOnly = true

[[mods]]
modId = "customtooltips"
version = "${version}"
displayName = "Custom Tooltip API"
authors = "Stalemated"
description = '''
A completely customizable, tag-based tooltip manager for developers and modpack makers.
'''
logoFile = "META-INF/icon.jpg"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/custom-tooltip-api"

[[mixins]]
config = "customtooltips.mixins.json"

[[mixins]]
config = "customtooltips-forge.mixins.json"

[[dependencies.customtooltips]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.customtooltips]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.customtooltips]]
modId = "s_lib"
mandatory = true
versionRange = "[2.1.0+1.20.1,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.customtooltips]]
modId = "yet_another_config_lib_v3"
mandatory = true
versionRange = "[3.6.6,)"
ordering = "AFTER"
side = "CLIENT"
