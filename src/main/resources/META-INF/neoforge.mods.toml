modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "${sources}/issues"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''
${description}
'''
${icon_key} = "assets/custom-tooltip-api/icon.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/custom-tooltip-api"

[[mixins]]
config = "${id}.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "s_lib"
type = "required"
versionRange = "[${slib},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${id}]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[3.6.6,)"
ordering = "AFTER"
side = "CLIENT"
